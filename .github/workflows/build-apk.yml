name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Allow notifications permission + RTL
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M
          grep -q supportsRtl $M || sed -i 's#<application#<application android:supportsRtl="true"#' $M
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: parts-counter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
